storage:
  type: local
  root: ./data
db:
  url: mysql+pymysql://examkit:examkit123@127.0.0.1:3309/exam_kit_migrate_20260509?charset=utf8mb4
  echo: false
  pool_size: 10
  max_overflow: 20
ragflow:
  enabled: true
  base_url: ${RAGFLOW_BASE_URL}
  api_key: ${RAGFLOW_KEY}
review:
  strict_when_sources_present: true
  max_retry: 2
  unverified_warning: '本次生成未提供权威资料，内容基于模型知识。

    请务必对照最新官方教材/规范核对后再使用。

    '
