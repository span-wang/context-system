app:
  name: exam-kit
  context_token_limit: 900000
llm:
  generator:
    provider: openai_compat
    model: deepseek-v4-flash
    max_tokens: 100000
    api_key: ${DEEPSEEK_GENERATOR_API_KEY}
    base_url: https://api.deepseek.com/v1
  reviewer:
    provider: openai_compat
    model: deepseek-v4-flash
    max_tokens: 100000
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_REVIEWER_API_KEY}
  presets:
  - provider: openai_compat
    model: deepseek-v4-flash
    max_tokens: 100000
    base_url: https://api.deepseek.com/v1
    name: DD预设
storage:
  type: local
  root: ./data
db:
  url: sqlite:///./data/app.db
ragflow:
  enabled: true
  base_url: ${RAGFLOW_BASE_URL}
  api_key: ${RAGFLOW_KEY}
review:
  strict_when_sources_present: true
  max_retry: 2
  unverified_warning: '本次生成未提供权威资料，内容基于模型知识。

    请务必对照最新官方教材/规范核对后再使用。

    '
